<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#273844">
  <title>LAMBDA1224 — Bio</title>
  <meta name="description" content="Ссылки и контакты">
  <meta property="og:title" content="AKA LAMBDA1224">
  <meta property="og:description" content="Ссылки и контакты">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #273844;
      --bg-dot: rgba(255, 255, 255, 0.07);
      --orange: #e35433;
      --ink: #101214;
      --text: #eef1f4;
      --text-muted: #8b98a6;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.09);
      --border-hover: rgba(227, 84, 51, 0.55);
      --accent-bg-hover: rgba(227, 84, 51, 0.08);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; padding: 0; }
    h1, p { margin: 0; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image: radial-gradient(var(--bg-dot) 1.4px, transparent 1.4px);
      background-size: 42px 42px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 64px 20px;
    }

    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--orange); color: var(--ink); }

    /* ---------- общая сетка страницы ---------- */
    .main-column {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile,
    .meta {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .meta { margin-top: 28px; }

    .content-row {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 40px;
    }

    /* на широких экранах панель проектов плавно "отъезжает" вправо
       (анимируется ширина), на мобильных остаётся под ссылками */
    @media (min-width: 900px) {
      .main-column { width: auto; max-width: none; align-items: flex-start; }
      .profile, .meta { max-width: 420px; }
      .content-row { flex-direction: row; align-items: flex-start; gap: 32px; width: auto; }
      .links { width: 420px; flex: 0 0 420px; }

      .projects-panel {
        flex: 0 0 0px;
        width: 0;
        min-width: 0;
        overflow: hidden;
        transition: flex-basis .45s var(--ease), width .45s var(--ease);
      }
      .projects-panel.is-open { flex: 0 0 420px; width: 420px; }
      .projects-panel .reveal,
      .projects-panel .rows { width: 420px; }
    }

    /* ---------- аватар / логотип ---------- */
    .avatar {
      --cut: 26px;
      width: 128px;
      height: 128px;
      background: var(--orange);
      clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
      transition: clip-path .16s ease;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 14px 16px 0 0;
      box-shadow: 0 20px 32px -16px rgba(0, 0, 0, 0.5);
      margin-bottom: 26px;
      overflow: hidden;
    }

    .avatar span {
      font-weight: 800;
      font-size: 34px;
      color: var(--ink);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
    }

    .tagline {
      margin-top: 10px;
      max-width: 100%;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
    }

    .tagline .prompt {
      color: var(--orange);
      margin-right: 6px;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 15px;
      vertical-align: -2px;
      margin-left: 2px;
      background: var(--orange);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* ---------- ссылки ---------- */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* единый класс формы для ВСЕХ строк: обычных ссылок, кнопки
       "Проекты" и заглушек в панели — форме больше неоткуда
       "слипаться" в прямоугольник, она всегда описана здесь одним
       и тем же способом через --cut */
    .link-item {
      --cut: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color .2s ease, background-color .2s ease, transform .2s ease, clip-path .16s ease;
    }

    a.link-item:hover, a.link-item:focus-visible,
    button.link-item:hover, button.link-item:focus-visible {
      border-color: var(--border-hover);
      background-color: var(--accent-bg-hover);
      transform: translateY(-2px);
    }

    /* нажатие: срезанные уголки "схлопываются" в прямой угол —
       цвет при этом не меняется, меняется именно форма */
    a.link-item:active, button.link-item:active,
    .social-item:active, .avatar:active {
      clip-path: polygon(0 0, 100% 0, 100% 100%, 100% 100%, 0 100%, 0 0);
    }

    /* подсветка кнопки "Проекты", пока панель открыта */
    .link-item.is-open {
      border-color: var(--border-hover);
      background-color: var(--accent-bg-hover);
    }

    /* строки-заглушки в панели проектов: не кликабельны, приглушены */
    .link-item.is-placeholder {
      opacity: .28;
      cursor: default;
    }

    .link-mark {
      --cut: 3px;
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      background: var(--orange);
      clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    }

    /* ---------- панель проектов: "выезжает из невидимой линии" ---------- */
    .projects-panel {
      width: 100%;
    }

    .projects-panel .reveal {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .5s var(--ease);
    }

    .projects-panel.is-open .reveal {
      grid-template-rows: 1fr;
    }

    .projects-panel .rows {
      overflow: hidden;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rows > .link-item {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .35s ease, transform .35s ease,
                  border-color .2s ease, background-color .2s ease, clip-path .16s ease;
    }

    .projects-panel.is-open .rows > .link-item {
      opacity: 1;
      transform: translateY(0);
    }

    .rows > .link-item:nth-child(1) { transition-delay: .10s, .10s, 0s, 0s, 0s; }
    .rows > .link-item:nth-child(2) { transition-delay: .15s, .15s, 0s, 0s, 0s; }
    .rows > .link-item:nth-child(3) { transition-delay: .20s, .20s, 0s, 0s, 0s; }
    .rows > .link-item:nth-child(4) { transition-delay: .25s, .25s, 0s, 0s, 0s; }
    .rows > .link-item:nth-child(5) { transition-delay: .30s, .30s, 0s, 0s, 0s; }

    /* ---------- соцсети ---------- */
    .socials {
      display: flex;
      gap: 12px;
    }

    .banners {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .banner-88x31 {
      display: block;
      width: 176px;
    }

    .banner-88x31 img {
      display: block;
      width: 100%;
      height: auto;
      opacity: .85;
      transition: opacity .2s ease;
    }

    .banner-88x31:hover img { opacity: 1; }

    .social-item {
      --cut: 10px;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
      transition: clip-path .16s ease, border-color .2s ease, color .2s ease, background-color .2s ease;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
    }

    .social-item:hover {
      border-color: var(--border-hover);
      color: var(--orange);
      background-color: var(--accent-bg-hover);
    }

    footer {
      margin-top: 40px;
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      opacity: .7;
    }

    @media (max-width: 380px) {
      .avatar { width: 108px; height: 108px; }
      .avatar span { font-size: 28px; }
      .name { font-size: 23px; }
      .link-item { padding: 14px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .001ms !important; animation-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <!--
    КАК РЕДАКТИРОВАТЬ ЭТОТ ШАБЛОН

    1. Аватар / имя / тэглайн — правьте текст прямо внутри .profile.
    2. .links — обычные пункты вида <a class="link-item">.
    3. Кнопка "Проекты" — <button>, не <a href="...">, клик никуда
       не ведёт: он добавляет/убирает класс "is-open" у панели и
       у самой кнопки, всё остальное — чистый CSS-transition
       (см. .reveal / .rows / .projects-panel в стилях).
    4. .projects-panel .rows — сюда добавляйте реальные проекты
       такими же <a class="link-item" href="...">. Строки с классом
       "is-placeholder" — приглушённые нередактируемые заглушки
       ("временно нет проектов"), не ссылки. Если добавляете/убираете
       пункты — поправьте цифры в блоке ":nth-child" в стилях, чтобы
       анимация появления пунктов по очереди осталась плавной.
    5. Соцсети — .social-item, меняйте href и подписи (GH/TG/...).
    6. При нажатии на любую кнопку/ссылку срезанные уголки на секунду
       "схлопываются" в прямой угол — это .link-item:active в стилях.
  -->
  <div class="main-column">

    <div class="profile">
      <div class="avatar">
        <span>λ</span>
        <!-- <img src="your-photo.jpg" alt="Avatar"> -->
      </div>

      <h1 class="name">AKA LAMBDA1224</h1>

      <p class="tagline">
        <span class="prompt">&gt;</span>неумелый вайбкодер, живу уже 14 полных лет<span class="cursor"></span>
      </p>
    </div>

    <div class="content-row">
      <nav class="links">
        <a class="link-item" href="https://t.me/lambda1224" target="_blank" rel="noopener">
          <span class="link-mark"></span>
          <span>Telegram</span>
        </a>
        <button class="link-item" type="button" id="projectsToggle" aria-expanded="false" aria-controls="projectsPanel">
          <span class="link-mark"></span>
          <span>Проекты</span>
        </button>
      </nav>

      <aside class="projects-panel" id="projectsPanel">
        <div class="reveal">
          <div class="rows">
            <a class="link-item" href="https://t.me/kupisochiminet" target="_blank" rel="noopener">
              <span class="link-mark"></span>
              <span>Linux System Datamines</span>
            </a>
            <a class="link-item" href="https://lambda1224.cyou/websource" target="_blank" rel="noopener">
              <span class="link-mark"></span>
              <span>Websource (Заброшен)</span>
            </a>
            <div class="link-item is-placeholder">
              <span class="link-mark"></span>
              <span>Временно нет проектов</span>
            </div>
            <div class="link-item is-placeholder">
              <span class="link-mark"></span>
              <span>Временно нет проектов</span>
            </div>
            <div class="link-item is-placeholder">
              <span class="link-mark"></span>
              <span>Временно нет проектов</span>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div class="meta">
      <div class="socials">
        <a class="social-item" href="https://github.com/lambda1224" target="_blank" rel="noopener" aria-label="GitHub">GH</a>
      </div>

      <div class="banners">
        <a href="https://t.me/ratogramx" target="_blank" rel="noopener" class="banner-88x31">
          <img src="https://raw.githubusercontent.com/lambda1224/lambda1224.github.io/refs/heads/main/ratogram.png" alt="ratogram" loading="lazy">
        </a>
      </div>

      <footer>© Lambda1224</footer>
    </div>

  </div>

  <script>
    (function () {
      var toggle = document.getElementById('projectsToggle');
      var panel = document.getElementById('projectsPanel');
      var isOpen = false;

      panel.inert = true;

      toggle.addEventListener('click', function () {
        isOpen = !isOpen;
        panel.classList.toggle('is-open', isOpen);
        toggle.classList.toggle('is-open', isOpen);
        toggle.setAttribute('aria-expanded', String(isOpen));
        panel.inert = !isOpen;
      });
    })();
  </script>
</body>
</html>
