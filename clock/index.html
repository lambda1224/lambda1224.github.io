:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
}

.container {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 100vh;
  background: #9a9a9a;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.bottom-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 5.5%;
  background: #0a0a0a;
  z-index: 1;
}



.content {
  padding-left: 6vw;
  position: relative;
  z-index: 2;
}

.time {
  font-family: 'DINPro', 'Arial Narrow', sans-serif;
  font-weight: bold;
  color: #ffffff;
  font-size: clamp(2.5rem, 7vw, 5.5rem);
  line-height: 1.05;
  letter-spacing: 0.01em;
  margin: 0;
}

.channel {
  font-family: 'DINPro', 'Arial Narrow', sans-serif;
  font-weight: bold;
  color: #ffffff;
  font-size: clamp(1.2rem, 3vw, 2.6rem);
  margin-top: 0.4em;
}
</style>
</head>
<body>
<div class="container">
  <div class="content">
    <div class="time" id="clock">00:00:00</div>
    <div class="channel">t.me/kupisochiminet</div>
  </div>
  <div class="bottom-bar"></div>
</div>

<script>
function pad(n) { return n.toString().padStart(2, '0'); }
function updateClock() {
  const now = new Date();
  const h = pad(now.getHours());
  const m = pad(now.getMinutes());
  const s = pad(now.getSeconds());
  document.getElementById('clock').textContent = h + ':' + m + ':' + s;
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
